# Nginx Production Configuration for AJDesigners
# Place in: /etc/nginx/sites-available/ajdesigners
# Enable: ln -s /etc/nginx/sites-available/ajdesigners /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ajdesigners.com www.ajdesigners.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ajdesigners.com www.ajdesigners.com;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/ajdesigners.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajdesigners.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Root Directory for Built React Frontend
    root /var/www/ajdesigners/client/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Uploaded Media Serving
    location /uploads/ {
        alias /var/www/ajdesigners/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # API Proxy to Node.js Backend Server
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # React Router Single Page App Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Access and Error Logs
    access_log /var/log/nginx/ajdesigners_access.log;
    error_log /var/log/nginx/ajdesigners_error.log;
}

